apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
spec:
  replicas: 1
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: explore-queue
spec:
  name: explore-queue
  rabbitmqClusterReference:
    name: rabbitmq
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: crawl-queue
spec:
  name: crawl-queue
  rabbitmqClusterReference:
    name: rabbitmq
