name: CI

on:
    push:
        branches:
            - develop
            - main
            - feat/helm
    pull_request:
        branches:
            - develop

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    test-services:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Test Services
              run: mvn -B test

    docker-frontend:
        runs-on: ubuntu-latest
        needs: [test-services]
        steps:
            - name: Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}/frontend
                  tags: |
                      type=schedule
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: services/frontend
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    docker-web-api:
        runs-on: ubuntu-latest
        needs: [test-services]
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Build Web API
              run: mvn -B clean package --projects :web-api --also-make

            - name: Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}/web-api
                  tags: |
                      type=schedule
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  build-args: JAR_FILE=services/web-api/target/app.jar
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    docker-worker:
        runs-on: ubuntu-latest
        needs: [test-services]
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Build Worker
              run: mvn -B clean package --projects :worker --also-make

            - name: Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}/worker
                  tags: |
                      type=schedule
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  build-args: JAR_FILE=services/worker/target/app.jar
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    helm-chart:
        runs-on: ubuntu-latest
        needs: [docker-frontend, docker-web-api, docker-worker]
        if: github.event_name != 'pull_request'
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v3
              with:
                  version: "3.12.0"

            - name: Determine version and app version
              id: version
              run: |
                  if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                      # For main branch, use semantic versioning
                      CHART_VERSION="0.1.1"
                      APP_VERSION="1.1.0"
                  elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
                      # For develop branch, use dev versioning
                      CHART_VERSION="0.1.1-dev.${{ github.run_number }}"
                      APP_VERSION="develop"
                  else
                      # For feature branches, use branch name
                      BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9.-]/-/g')
                      CHART_VERSION="0.1.1-${BRANCH_NAME}.${{ github.run_number }}"
                      APP_VERSION="develop"
                  fi

                  echo "chart-version=$CHART_VERSION" >> $GITHUB_OUTPUT
                  echo "app-version=$APP_VERSION" >> $GITHUB_OUTPUT
                  echo "Chart version: $CHART_VERSION"
                  echo "App version: $APP_VERSION"

            - name: Set Helm Chart version and appVersion
              run: |
                  echo "Setting Helm Chart version to ${{ steps.version.outputs.chart-version }} and appVersion to ${{ steps.version.outputs.app-version }}"
                  sed -i "s/^version: .*/version: ${{ steps.version.outputs.chart-version }}/g" "Chart.yaml"
                  sed -i "s/^appVersion: .*/appVersion: ${{ steps.version.outputs.app-version }}/g" "Chart.yaml"
                  cat Chart.yaml
              working-directory: helm

            - name: Helm lint
              run: helm lint
              working-directory: helm

            - name: Helm template
              run: |
                  helm template . --debug
              working-directory: helm

            - name: Package Helm chart
              run: helm package . --destination .
              working-directory: helm

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push chart to GHCR
              run: |
                  owner="${GITHUB_REPOSITORY_OWNER,,}"
                  shopt -s nullglob
                  files=$(find helm/ -type f -name "*.tgz")
                  for pkg in $files; do
                      echo "Pushing ${pkg} to ghcr.io/$owner"
                      if [ -z "${pkg:-}" ]; then
                          break
                      fi
                      helm push "${pkg}" "oci://ghcr.io/$owner"
                  done
