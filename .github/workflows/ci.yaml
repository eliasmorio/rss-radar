name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Test Services
        run: mvn -B test

  docker-frontend:
    runs-on: ubuntu-latest
    needs: [test-services]
    steps:
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=dev-${{ github.run_number }},enable=${{ github.ref != 'refs/heads/main' && github.ref_name == 'develop' }}
            type=raw,value=develop,enable=${{ github.ref != 'refs/heads/main' && github.ref_name == 'develop' }}
            type=raw,value=v{{version}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value={{branch}}-{{sha}},enable=${{ github.ref != 'refs/heads/main' && github.ref_name != 'develop' }}

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web-api:
    runs-on: ubuntu-latest
    needs: [test-services]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build Web API
        run: mvn -B clean package --projects :web-api --also-make

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web-api
          tags: |
            type=raw,value=dev-${{ github.run_number }},enable=${{ github.ref != 'refs/heads/main' && github.ref_name == 'develop' }}
            type=raw,value=develop,enable=${{ github.ref != 'refs/heads/main' && github.ref_name == 'develop' }}
            type=raw,value=v{{version}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value={{branch}}-{{sha}},enable=${{ github.ref != 'refs/heads/main' && github.ref_name != 'develop' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: JAR_FILE=services/web-api/target/app.jar
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-worker:
    runs-on: ubuntu-latest
    needs: [test-services]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build Worker
        run: mvn -B clean package --projects :worker --also-make
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=raw,value=dev-${{ github.run_number }},enable=${{ github.ref != 'refs/heads/main' && github.ref_name == 'develop' }}
            type=raw,value=develop,enable=${{ github.ref != 'refs/heads/main' && github.ref_name == 'develop' }}
            type=raw,value=v{{version}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value={{branch}}-{{sha}},enable=${{ github.ref != 'refs/heads/main' && github.ref_name != 'develop' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: JAR_FILE=services/worker/target/app.jar
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-scheduler:
    runs-on: ubuntu-latest
    needs: [test-services]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build Scheduler
        run: mvn -B clean package --projects :scheduler --also-make

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/scheduler
          tags: |
            type=raw,value=dev-${{ github.run_number }},enable=${{ github.ref != 'refs/heads/main' && github.ref_name == 'develop' }}
            type=raw,value=develop,enable=${{ github.ref != 'refs/heads/main' && github.ref_name == 'develop' }}
            type=raw,value=v{{version}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value={{branch}}-{{sha}},enable=${{ github.ref != 'refs/heads/main' && github.ref_name != 'develop' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: JAR_FILE=services/scheduler/target/app.jar
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
